<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><link rel="stylesheet" href="admin.css"><title>HalalCheck Admin</title></head><body><main class="admin-shell"><header><strong>HalalCheck Admin</strong><button id="sign-out" hidden>Sign out</button></header><section id="auth-panel" class="panel"><h1>Private owner access</h1><p>Sign in with the administrator account configured in Supabase Auth.</p><form id="auth-form"><input id="email" type="email" autocomplete="username" placeholder="Administrator email" required><input id="password" type="password" autocomplete="current-password" placeholder="Password" required><button type="submit">Sign in</button></form><p id="auth-error" role="alert"></p></section><section id="dashboard" hidden><div class="toolbar"><h1>Overview</h1><select id="range"><option value="1">Today</option><option value="7">Last 7 days</option><option value="30">Last 30 days</option><option value="90">Last 90 days</option></select></div><div id="cards" class="cards"></div><div id="empty" class="panel" hidden>No analytics data has been collected yet. Real events will appear here after consent and deployment are configured.</div><pre id="data" class="panel" hidden></pre></section></main><script src="config.js"></script><script type="module" src="admin.js"></script></body></html>
