<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><link rel="stylesheet" href="../admin.css"><title>Set HalalCheck Admin Password</title></head><body><main class="admin-shell"><header><strong>HalalCheck Admin</strong></header><section class="panel"><h1>Set your owner password</h1><p>This secure form updates the password for the existing Supabase account. It does not create accounts or grant administrator access.</p><form id="password-form" hidden><label for="new-password">New password</label><input id="new-password" type="password" autocomplete="new-password" minlength="12" required><label for="confirm-password">Confirm password</label><input id="confirm-password" type="password" autocomplete="new-password" minlength="12" required><button type="submit">Save password</button></form><p id="status" role="status" aria-live="polite">Validating your secure recovery link...</p><p id="error" role="alert"></p><p><a href="/admin/">Return to admin sign in</a></p></section></main><script src="../config.js"></script><script src="../runtime-config.js"></script><script type="module" src="reset-password.js"></script></body></html>
